version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: fmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_market_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fmp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./apps/api
      dockerfile: docker/Dockerfile
    container_name: fmp-api
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - postgres
      - redis
    ports:
      - '4000:4000'

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: fmp-web
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - api
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
